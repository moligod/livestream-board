[package]
name = "tokenusage-agent-import"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
chrono = "0.4"
dirs = "6.0"
log = "0.4"
prost = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"
